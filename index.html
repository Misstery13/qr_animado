<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Animado — Glitch</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }

  /* Scanline overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 3px,
      rgba(0,255,65,0.03) 3px, rgba(0,255,65,0.03) 4px
    );
    pointer-events: none;
    z-index: 100;
  }

  .title {
    font-size: 11px;
    letter-spacing: 6px;
    color: rgba(0,255,65,0.5);
    text-transform: uppercase;
    margin-bottom: 28px;
    animation: fadePulse 3s ease-in-out infinite;
  }

  .qr-wrapper {
    position: relative;
    width: 280px;
    height: 280px;
  }

  /* The actual QR canvas sits here */
  #qr-base {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    filter: contrast(1.1);
  }

  #qr-base canvas,
  #qr-base img {
    width: 260px !important;
    height: 260px !important;
    image-rendering: pixelated;
  }

  /* Glitch layers on top of QR */
  .glitch-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }

  /* Canvas where we draw glitch effects */
  #glitch-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    mix-blend-mode: screen;
    opacity: 0.85;
  }

  /* Animated border */
  .qr-border {
    position: absolute;
    inset: -8px;
    border: 1px solid rgba(0,255,65,0.4);
    animation: borderPulse 2s ease-in-out infinite;
  }
  .qr-border::before, .qr-border::after {
    content: '';
    position: absolute;
    width: 16px; height: 16px;
    border-color: #00ff41;
    border-style: solid;
  }
  .qr-border::before {
    top: -1px; left: -1px;
    border-width: 2px 0 0 2px;
  }
  .qr-border::after {
    bottom: -1px; right: -1px;
    border-width: 0 2px 2px 0;
  }

  /* Corner accents */
  .corner {
    position: absolute;
    width: 16px; height: 16px;
    border-color: #00ff41;
    border-style: solid;
    animation: cornerAnim 2s ease-in-out infinite;
  }
  .corner.tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
  .corner.bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }

  /* Sweep line */
  .sweep {
    position: absolute;
    left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(0,255,65,0.8), transparent);
    animation: sweep 2.5s linear infinite;
    pointer-events: none;
  }

  .label-bottom {
    margin-top: 24px;
    text-align: center;
  }
  .label-bottom .url-text {
    font-size: 10px;
    letter-spacing: 2px;
    color: rgba(0,255,65,0.6);
    animation: fadePulse 2s ease-in-out infinite 0.5s;
    display: block;
    margin-bottom: 6px;
  }
  .label-bottom .scan-text {
    font-size: 13px;
    letter-spacing: 3px;
    color: #00ff41;
    text-shadow: 0 0 10px rgba(0,255,65,0.6);
    animation: fadePulse 1.5s ease-in-out infinite;
    display: block;
  }

  /* Floating particles */
  .particle {
    position: fixed;
    font-size: 10px;
    color: rgba(0,255,65,0.15);
    animation: float linear infinite;
    pointer-events: none;
    font-family: 'Courier New', monospace;
  }

  /* Input section */
  .controls {
    margin-top: 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    width: 280px;
  }
  .controls input {
    width: 100%;
    background: rgba(0,255,65,0.05);
    border: 1px solid rgba(0,255,65,0.3);
    color: #00ff41;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    padding: 10px 14px;
    letter-spacing: 1px;
    outline: none;
    transition: border-color 0.2s;
  }
  .controls input:focus { border-color: rgba(0,255,65,0.8); }
  .controls input::placeholder { color: rgba(0,255,65,0.3); }
  .controls button {
    width: 100%;
    background: rgba(0,255,65,0.1);
    border: 1px solid rgba(0,255,65,0.5);
    color: #00ff41;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    padding: 10px;
    cursor: pointer;
    text-transform: uppercase;
    transition: background 0.2s, box-shadow 0.2s;
  }
  .controls button:hover {
    background: rgba(0,255,65,0.2);
    box-shadow: 0 0 12px rgba(0,255,65,0.3);
  }

  @keyframes fadePulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }
  @keyframes borderPulse {
    0%, 100% { border-color: rgba(0,255,65,0.4); box-shadow: 0 0 8px rgba(0,255,65,0.1); }
    50% { border-color: rgba(0,255,65,0.8); box-shadow: 0 0 20px rgba(0,255,65,0.3); }
  }
  @keyframes cornerAnim {
    0%, 100% { border-color: rgba(0,255,65,0.5); }
    50% { border-color: #00ff41; filter: drop-shadow(0 0 4px #00ff41); }
  }
  @keyframes sweep {
    0%   { top: -2px; opacity: 0; }
    5%   { opacity: 1; }
    95%  { opacity: 1; }
    100% { top: 100%; opacity: 0; }
  }
  @keyframes float {
    0%   { transform: translateY(100vh); opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 1; }
    100% { transform: translateY(-20px); opacity: 0; }
  }
</style>
</head>
<body>

<div class="title">▸ código qr ◂ programación</div>

<div class="qr-wrapper">
  <div class="qr-border">
    <div class="corner tr"></div>
    <div class="corner bl"></div>
  </div>
  <div id="qr-base"></div>
  <div class="glitch-layer">
    <canvas id="glitch-canvas"></canvas>
    <div class="sweep"></div>
  </div>
</div>

<div class="label-bottom">
  <span class="url-text" id="url-display">netlify.app/tu-animacion</span>
  <span class="scan-text">▸ escanear ◂</span>
</div>

<div class="controls">
  <input type="text" id="url-input" placeholder="pega tu URL de Netlify aquí" value="https://github.com/Misstery13"/>
  <button onclick="regenerateQR()">▸ generar qr ◂</button>
</div>

<script>
const GLITCH_COLORS = ['#00ff41','#00f5ff','#ff003c','#ffe600'];
let qrGenerated = false;
let glitchInterval = null;

function generateQR(url) {
  const container = document.getElementById('qr-base');
  container.innerHTML = '';
  try {
    new QRCode(container, {
      text: url,
      width: 260,
      height: 260,
      colorDark: '#00ff41',
      colorLight: '#000000',
      correctLevel: QRCode.CorrectLevel.H
    });
  } catch(e) {
    container.innerHTML = '<div style="color:#ff003c;font-size:11px;text-align:center;padding:20px">URL inválida</div>';
    return;
  }
  document.getElementById('url-display').textContent = url.replace('https://','');
  qrGenerated = true;
  startGlitchEngine();
}

function regenerateQR() {
  const url = document.getElementById('url-input').value.trim();
  if (!url) return;
  if (glitchInterval) { clearInterval(glitchInterval); glitchInterval = null; }
  generateQR(url);
}

/* ── GLITCH ENGINE ── */
function startGlitchEngine() {
  const canvas = document.getElementById('glitch-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width  = canvas.offsetWidth  || 280;
  canvas.height = canvas.offsetHeight || 280;

  let frame = 0;

  function drawFrame() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    frame++;

    const t = frame / 60;

    // Slow color overlay pulse on the QR
    const cycle = Math.sin(t * 0.8);
    if (cycle > 0.7) {
      ctx.fillStyle = `rgba(0,245,255,${(cycle - 0.7) * 0.18})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    // Glitch slices — occasional horizontal displacement bands
    const glitchActive = (Math.sin(t * 3.1) > 0.75) || (Math.sin(t * 7.3) > 0.88);
    if (glitchActive) {
      const numSlices = Math.floor(Math.random() * 4) + 1;
      for (let i = 0; i < numSlices; i++) {
        const y      = Math.random() * canvas.height;
        const h      = Math.random() * 12 + 2;
        const shift  = (Math.random() - 0.5) * 24;
        const color  = GLITCH_COLORS[Math.floor(Math.random() * GLITCH_COLORS.length)];
        const alpha  = Math.random() * 0.5 + 0.2;

        // Colored scan stripe
        ctx.fillStyle = color.replace(')', `,${alpha})`).replace('rgb','rgba').replace('#','');
        // Use rgba directly
        ctx.save();
        ctx.globalAlpha = alpha * 0.4;
        ctx.fillStyle = color;
        ctx.fillRect(0, y, canvas.width, h);
        ctx.restore();

        // Shift band (chromatic-aberration feel)
        ctx.save();
        ctx.globalAlpha = 0.15;
        ctx.fillStyle = i % 2 === 0 ? '#ff003c' : '#00f5ff';
        ctx.fillRect(shift > 0 ? 0 : Math.abs(shift), y, canvas.width - Math.abs(shift), h * 0.5);
        ctx.restore();
      }
    }

    // Vertical noise lines
    if (Math.random() < 0.08) {
      const x = Math.random() * canvas.width;
      ctx.save();
      ctx.globalAlpha = 0.3;
      ctx.strokeStyle = GLITCH_COLORS[Math.floor(Math.random() * GLITCH_COLORS.length)];
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, canvas.height);
      ctx.stroke();
      ctx.restore();
    }

    // Corner flicker squares (like finder pattern highlight)
    const cornerSize = 60;
    const corners = [[0,0],[canvas.width-cornerSize,0],[canvas.width-cornerSize,canvas.height-cornerSize],[0,canvas.height-cornerSize]];
    const glowIntensity = (Math.sin(t * 2) + 1) / 2;
    corners.forEach(([cx,cy]) => {
      ctx.save();
      ctx.globalAlpha = glowIntensity * 0.12;
      ctx.strokeStyle = '#00ff41';
      ctx.lineWidth = 2;
      ctx.strokeRect(cx + 8, cy + 8, cornerSize - 16, cornerSize - 16);
      ctx.restore();
    });

    requestAnimationFrame(drawFrame);
  }

  drawFrame();
}

/* ── FLOATING PARTICLES ── */
const chars = ['0','1','{','}','<','>','/','=',';','#','λ','∑','∂'];
function spawnParticle() {
  const el = document.createElement('div');
  el.className = 'particle';
  el.textContent = chars[Math.floor(Math.random() * chars.length)];
  el.style.left = Math.random() * 100 + 'vw';
  const dur = Math.random() * 8 + 6;
  el.style.animationDuration = dur + 's';
  el.style.animationDelay = Math.random() * -dur + 's';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), dur * 1000 + 500);
}
setInterval(spawnParticle, 600);
for (let i = 0; i < 12; i++) spawnParticle();

/* ── INIT ── */
window.addEventListener('load', () => {
  setTimeout(() => generateQR(document.getElementById('url-input').value), 300);
});
</script>
</body>
</html>
